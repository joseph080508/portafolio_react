<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio de Joseph Herreño, desarrollador en formación especializado en experiencias web con React, TypeScript y Tailwind CSS." />
    <title>Joseph Herreño | Portafolio</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
      <meta property="og:title" content="Joseph Herreño | Portafolio" />
    <meta property="og:description" content="Portafolio de Joseph Herreño, desarrollador en formación especializado en experiencias web con React, TypeScript y Tailwind CSS." />

    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
</html>
